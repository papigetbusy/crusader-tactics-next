# The build robot. On every change to main it:
#   1. checks formatting and runs every test (anything red stops everything;
#      nothing is published and the last good version stays live)
#   2. turns the test results into the Rule Book, Old-Game Match, House Rules
#      and Changes pages
#   3. builds the game into WebAssembly and publishes it all to GitHub Pages
name: Test, build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
      - name: Code is neatly formatted
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo "Run gofmt on the files above" && exit 1)
      - name: Run all tests and make the pages
        run: |
          mkdir -p site
          echo "LABEL=build-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          set +e
          mkdir -p match && OLDGAME_REPORT="$PWD/match" go test -json ./... > test.json
          status=$?
          set -e
          go run ./tools/report -tests test.json -match match -changes docs/changes-from-old-game.md -build "build-${GITHUB_SHA::7}" -out site
          if [ $status -ne 0 ]; then
            echo "Some tests are red (listed above). Nothing is published; the last good version stays live."
            go test ./... 2>&1 | grep -E "^(---|    |FAIL)" | head -60
            exit 1
          fi
      - name: Build the game for the browser
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w -X main.build=$LABEL" -o site/app.wasm ./adapters/wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/
          sed "s/__BUILD__/$LABEL/g" web/index.html > site/index.html
          sed "s/__BUILD__/$LABEL/g" web/game/play.html > site/play.html
          mkdir -p site/game/js && cp web/game/style.css site/game/
          for f in web/game/js/*.js; do sed "s/\.js';/.js?v=$LABEL';/g" "$f" > "site/game/js/$(basename "$f")"; done
          cp -r web/assets site/assets
          cp -r new-animations site/new-animations
          grep -v '^#' new-animations/unpublished.txt | while read -r d; do [ -n "$d" ] && rm -rf "site/new-animations/$d"; done
          sed "s/__BUILD__/$LABEL/g" web/codex/codex.html > site/codex.html && cp web/codex/codex.json site/codex.json
          ls -l site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
