const main = document.getElementById("main");
function render() {
  const groups = ["Weapons", "Armor", "Charms"];
  main.innerHTML = groups.map(g => `<section id="${g.toLowerCase()}"><h2>${g}</h2>` +
    ITEMS.filter(it => it.group === g).map(it => `<div class="item"><h3>${it.title}<span>${it.note}</span></h3><div class="row">` +
      it.shots.map(s => `<button type="button" data-id="${it.id}" data-s="${s.id}" class="${picks[it.id]===s.id?"on":""}"><img src="${s.src}" alt="${it.title}, ${it.note}, ${s.title}"><b>${s.title}</b></button>`).join("") +
      `</div></div>`).join("") + `</section>`).join("");
  const n = ITEMS.filter(it => picks[it.id]).length;
  document.getElementById("count").textContent = n + " of " + ITEMS.length + " picked";
}
main.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  picks[b.dataset.id] = b.dataset.s;
  localStorage.setItem(KEY, JSON.stringify(picks));
  render();
});
